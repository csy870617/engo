# 4시간마다 한국 영자 신문 RSS를 받아 news.json을 저장소에 올린다
# (사이트는 main 브랜치에서 GitHub Pages가 바로 만들므로, 배포 작업에서 만든 파일은 덮어써진다. 그래서 저장소에 넣는다)
name: Update news

on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch news
        run: node scripts/fetch-news.js

      - name: Commit and rebuild Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- news.json && git ls-files --error-unmatch news.json >/dev/null 2>&1; then
            echo "news unchanged"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "Update news"
          git pull --rebase origin main
          git push origin HEAD:main
          # 이 작업이 올린 커밋으로는 Pages가 저절로 다시 만들어지지 않을 수 있어 직접 요청한다
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
