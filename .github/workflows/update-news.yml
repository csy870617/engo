# 4시간마다 한국 영자 신문 RSS를 받아 news.json을 저장소에 올린다
# 작업이 올린 커밋으로는 배포가 저절로 돌지 않으므로, 올린 뒤 배포 작업(deploy.yml)을 직접 실행한다
name: Update news

on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch news
        run: node scripts/fetch-news.js

      - name: Commit and rebuild Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- news.json && git ls-files --error-unmatch news.json >/dev/null 2>&1; then
            echo "news unchanged"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "Update news"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run deploy.yml --ref main
